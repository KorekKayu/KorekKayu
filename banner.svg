<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#2a0808" />
      <stop offset="60%" stop-color="#140505" />
      <stop offset="100%" stop-color="#0d1117" />
    </radialGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#fca5a5" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Cyber Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ef4444" stroke-width="1" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Container Base -->
  <rect width="900" height="240" rx="16" fill="url(#bgGlow)" />
  <rect width="900" height="240" rx="16" fill="url(#grid)" />

  <!-- Outer Neon Border Frame -->
  <rect x="2" y="2" width="896" height="236" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Center Ambient Glow Circle -->
  <circle cx="450" cy="120" r="100" fill="#ef4444" opacity="0.15" filter="url(#softGlow)" />

  <!-- Content Group -->
  <g text-anchor="middle" transform="translate(450, 0)">
    
    <!-- Oni Mask Badge Container -->
    <g transform="translate(0, 36)">
      <rect x="-110" y="0" width="220" height="28" rx="14" fill="#1f0909" stroke="#ef4444" stroke-width="1" opacity="0.9" />
      <text x="0" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#fca5a5" letter-spacing="1.5">
        👹 IKONA INC • DEV ECOSYSTEM
      </text>
    </g>

    <!-- Main Title: KorekKayu // IKONA ONI -->
    <text x="0" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', sans-serif" font-size="44" font-weight="900" fill="url(#textGrad)" filter="url(#neonGlow)" letter-spacing="-0.5">
      KorekKayu // IKONA ONI
    </text>

    <!-- Subtitle -->
    <text x="0" y="165" font-family="Consolas, 'JetBrains Mono', 'Courier New', monospace" font-size="14" font-weight="600" fill="#a1a1aa" letter-spacing="2">
      CHROME EXTENSIONS • WEB AUTOMATION • APPS
    </text>

    <!-- Bottom Accent Bar -->
    <line x1="-120" y1="195" x2="120" y2="195" stroke="#ef4444" stroke-width="2" stroke-linecap="round" opacity="0.8" filter="url(#neonGlow)" />
  </g>
</svg>
